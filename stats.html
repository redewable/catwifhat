<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>catwifhat — Analytics</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#1a1814; --cream:#f3ece1; --cream-d:#e2d6c9; --white:#fffaf4; --blue:#2e5fd8; --ginger:#e08a3c; --green:#1aa06a; --red:#d8483c; --purple:#8e44ad; --pink:#e84393; --shadow:0 4px 16px rgba(26,24,20,.06); }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; background:var(--cream); color:var(--ink); font-family:'Hanken Grotesk',system-ui,sans-serif; display:flex; flex-direction:column; overflow:hidden; }
    .bar { flex:none; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.7rem clamp(.8rem,2vw,1.4rem); flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:.6rem; }
    .brand h1 { font-family:'Unbounded',sans-serif; font-weight:900; font-size:clamp(1.1rem,2.4vw,1.5rem); margin:0; }
    .livepill { display:inline-flex; align-items:center; gap:.4rem; font-weight:800; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; background:#ffe9e6; color:var(--red); padding:.28rem .6rem; border-radius:999px; }
    .livepill.is-off { background:var(--cream-d); color:var(--ink); opacity:.6; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--red); animation:pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
    .ctrls { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
    .ranges { display:flex; gap:.3rem; }
    .rbtn { border:2px solid var(--cream-d); background:var(--white); color:var(--ink); font-weight:700; font-size:.8rem; padding:.35rem .8rem; border-radius:999px; cursor:pointer; }
    .rbtn.is-on { background:var(--blue); border-color:var(--blue); color:#fff; }
    .updated { font-size:.74rem; font-weight:600; opacity:.5; min-width:8ch; }

    #view { flex:1; min-height:0; display:flex; flex-direction:column; padding:0 clamp(.8rem,2vw,1.4rem) clamp(.8rem,2vw,1.4rem); gap:.7rem; }

    .kpis { flex:none; display:grid; grid-template-columns:repeat(6,1fr); gap:.7rem; }
    .kpi { background:var(--white); border-radius:14px; box-shadow:var(--shadow); padding:.6rem .8rem; min-width:0; }
    .kpi__k { font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; opacity:.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .kpi__v { font-family:'Unbounded',sans-serif; font-weight:800; font-size:clamp(1.1rem,2.2vw,1.7rem); margin-top:.1rem; line-height:1.1; }
    .kpi--live .kpi__v { color:var(--red); }

    .dash { flex:1; min-height:0; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(3,minmax(0,1fr)); gap:.7rem; }
    .panel { background:var(--white); border-radius:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden; }
    .panel__h { flex:none; display:flex; align-items:baseline; justify-content:space-between; gap:.5rem; padding:.6rem .85rem .35rem; }
    .panel__h h2 { font-family:'Unbounded',sans-serif; font-weight:800; font-size:.82rem; margin:0; }
    .panel__h small { font-size:.66rem; font-weight:700; opacity:.45; }
    .panel__b { flex:1; min-height:0; overflow:auto; padding:.1rem .85rem .6rem; }
    .panel__b::-webkit-scrollbar { width:7px; } .panel__b::-webkit-scrollbar-thumb { background:var(--cream-d); border-radius:9px; }

    .p-chart { grid-column:1/3; grid-row:1; } .p-funnel { grid-column:3; grid-row:1; } .p-events { grid-column:4; grid-row:1; }
    .p-sources { grid-column:1; grid-row:2; } .p-pages { grid-column:2; grid-row:2; } .p-countries { grid-column:3; grid-row:2; } .p-devices { grid-column:4; grid-row:2; }
    .p-feed { grid-column:1/3; grid-row:3; } .p-memes { grid-column:3; grid-row:3; } .p-campaigns { grid-column:4; grid-row:3; }

    .chart { width:100%; height:100%; display:block; }

    .bar-row { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:.5rem; padding:.28rem 0; }
    .bar-row + .bar-row { border-top:1px solid var(--cream-d); }
    .bar-name { font-weight:700; font-size:.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bar-track { height:6px; border-radius:999px; background:var(--cream-d); margin-top:.22rem; overflow:hidden; }
    .bar-fill { height:100%; background:var(--blue); border-radius:999px; }
    .bar-n { font-family:'Unbounded',sans-serif; font-weight:800; font-size:.8rem; white-space:nowrap; }
    .bar-n small { font-family:'Hanken Grotesk'; font-weight:700; opacity:.4; font-size:.66rem; margin-left:.2rem; }

    .events-grid { display:grid; grid-template-columns:1fr 1fr; gap:.45rem; }
    .ev { background:var(--cream); border-radius:10px; padding:.45rem .55rem; }
    .ev__k { font-size:.64rem; font-weight:700; opacity:.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ev__v { font-family:'Unbounded',sans-serif; font-weight:800; font-size:1rem; }

    .funnel__step { padding:.35rem 0; }
    .funnel__top { display:flex; justify-content:space-between; align-items:baseline; font-weight:700; font-size:.82rem; }
    .funnel__pct { font-family:'Unbounded',sans-serif; font-weight:800; }
    .funnel__track { height:9px; border-radius:999px; background:var(--cream-d); margin-top:.25rem; overflow:hidden; }
    .funnel__fill { height:100%; border-radius:999px; }

    .feed { list-style:none; margin:0; padding:0; }
    .feed li { display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; align-items:center; gap:.5rem; padding:.3rem 0; font-size:.78rem; }
    .feed li + li { border-top:1px solid var(--cream-d); }
    .tag { font-size:.62rem; font-weight:800; text-transform:uppercase; letter-spacing:.02em; padding:.12rem .4rem; border-radius:6px; white-space:nowrap; }
    .feed__where { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.8; }
    .feed__t { font-variant-numeric:tabular-nums; opacity:.45; font-weight:700; font-size:.7rem; white-space:nowrap; }
    .muted { opacity:.5; font-weight:600; padding:.4rem 0; }

    .setupwrap { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; }
    .setup { background:var(--white); border-radius:16px; box-shadow:var(--shadow); padding:1.4rem 1.6rem; max-width:560px; line-height:1.6; }
    .setup code { background:var(--cream); padding:.1rem .4rem; border-radius:6px; font-size:.9em; }
    .setup input { font:inherit; padding:.6rem .8rem; border:2px solid var(--cream-d); border-radius:10px; width:100%; max-width:320px; }
    .setup .btn { font:inherit; font-weight:800; border:none; background:var(--blue); color:#fff; padding:.6rem 1.1rem; border-radius:10px; cursor:pointer; }
    svg text { font-family:'Hanken Grotesk',sans-serif; }

    @media (max-width:1180px) {
      body { overflow:auto; }
      .kpis { grid-template-columns:repeat(3,1fr); }
      .dash { grid-template-columns:repeat(2,1fr); grid-template-rows:none; grid-auto-rows:minmax(190px,auto); }
      .p-chart,.p-funnel,.p-events,.p-sources,.p-pages,.p-countries,.p-devices,.p-feed,.p-memes,.p-campaigns { grid-column:auto; grid-row:auto; }
      .p-chart,.p-feed { grid-column:1/3; }
    }
    @media (max-width:620px) {
      .kpis { grid-template-columns:repeat(2,1fr); }
      .dash { grid-template-columns:1fr; }
      .p-chart,.p-feed { grid-column:auto; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <h1>catwifhat · analytics 🐾</h1>
      <span class="livepill is-off" id="livepill"><span class="dot"></span> <span id="liveN">—</span> online</span>
    </div>
    <div class="ctrls" id="ctrls" hidden>
      <div class="ranges" id="ranges">
        <button class="rbtn" data-d="1">24h</button>
        <button class="rbtn is-on" data-d="7">7d</button>
        <button class="rbtn" data-d="30">30d</button>
        <button class="rbtn" data-d="90">90d</button>
      </div>
      <span class="updated" id="updated"></span>
    </div>
  </div>
  <div id="view"><div class="setupwrap"><div class="setup" id="boot">Loading…</div></div></div>

  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var view = $("view"), ctrls = $("ctrls"), updated = $("updated"), livepill = $("livepill"), liveN = $("liveN");
    var KEY = new URLSearchParams(location.search).get("key");
    try { if (KEY) localStorage.setItem("wif_stats_key", KEY); else KEY = localStorage.getItem("wif_stats_key"); } catch (e) {}
    var days = 7, timer = null, lastAt = 0, tick = null;

    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function n(x) { return (Number(x) || 0).toLocaleString(); }
    function flag(cc) { if (!cc || cc.length !== 2) return "🏳️"; try { return String.fromCodePoint.apply(null, cc.toUpperCase().split("").map(function (c) { return 127397 + c.charCodeAt(0); })); } catch (e) { return "🏳️"; } }
    function dur(s) { s = Number(s) || 0; if (s < 60) return s + "s"; var m = Math.floor(s / 60); return m + "m " + (s % 60) + "s"; }
    function ago(ts) { var d = (Date.now() - new Date(ts).getTime()) / 1000; if (d < 60) return Math.max(0, Math.round(d)) + "s"; if (d < 3600) return Math.round(d / 60) + "m"; if (d < 86400) return Math.round(d / 3600) + "h"; return Math.round(d / 86400) + "d"; }

    function setBoot(html, isCtrls) { ctrls.hidden = !isCtrls; view.innerHTML = '<div class="setupwrap"><div class="setup">' + html + "</div></div>"; }
    function askKey(msg) {
      setBoot('<p>' + esc(msg) + '</p><input type="password" id="k" placeholder="STATS_TOKEN" /> <button class="btn" id="go">Open</button>', false);
      $("go").onclick = function () { KEY = $("k").value.trim(); try { localStorage.setItem("wif_stats_key", KEY); } catch (e) {} load(); };
      $("k").addEventListener("keydown", function (e) { if (e.key === "Enter") $("go").click(); });
    }
    function setupHelp() {
      setBoot('<h2 style="margin-top:0">Finish the setup</h2><ol><li>Run <code>supabase-analytics.sql</code> in Supabase → SQL editor.</li>' +
        '<li>Add <code>SUPABASE_URL</code>, <code>SUPABASE_SERVICE_ROLE_KEY</code>, <code>STATS_TOKEN</code> in Vercel env vars.</li>' +
        '<li>Redeploy, then open <code>/stats?key=YOUR_STATS_TOKEN</code>.</li></ol>', false);
    }

    /* ---------- renderers ---------- */
    function bars(list, opts) {
      list = list || []; opts = opts || {};
      if (!list.length) return '<p class="muted">No data yet.</p>';
      var max = Math.max.apply(null, list.map(function (x) { return x.count || 0; })) || 1;
      return list.map(function (x) {
        var w = Math.max(3, Math.round((x.count || 0) / max * 100));
        var label = (x.label == null || x.label === "") ? (opts.none || "(none)") : x.label;
        if (opts.map) label = opts.map(label, x);
        return '<div class="bar-row"><div style="min-width:0"><div class="bar-name">' + esc(label) + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%' + (opts.color ? ';background:' + opts.color : '') + '"></div></div></div>' +
          '<div class="bar-n">' + n(x.count) + (x.visitors != null ? '<small>' + n(x.visitors) + '</small>' : "") + "</div></div>";
      }).join("");
    }

    function chart(series) {
      series = series || [];
      if (series.length < 2) return '<p class="muted">Not enough data yet to chart.</p>';
      var W = 760, H = 230, pad = 26;
      var max = Math.max.apply(null, series.map(function (p) { return p.views || 0; })) || 1;
      var step = (W - pad * 2) / (series.length - 1);
      function X(i) { return pad + i * step; }
      function Y(v) { return H - pad - (v / max) * (H - pad * 2); }
      var dViews = series.map(function (p, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.views || 0).toFixed(1); }).join(" ");
      var dVisit = series.map(function (p, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.visitors || 0).toFixed(1); }).join(" ");
      var area = dViews + " L" + X(series.length - 1).toFixed(1) + " " + (H - pad) + " L" + X(0).toFixed(1) + " " + (H - pad) + " Z";
      function lbl(p) { try { var d = new Date(p.bucket); return days <= 2 ? d.toLocaleTimeString([], { hour: "numeric" }) : d.toLocaleDateString([], { month: "short", day: "numeric" }); } catch (e) { return ""; } }
      var stepLbl = Math.ceil(series.length / 7), ticks = "";
      series.forEach(function (p, i) { if (i % stepLbl === 0) ticks += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" font-size="11" fill="rgba(26,24,20,.5)" text-anchor="middle">' + esc(lbl(p)) + "</text>"; });
      return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet">' +
        '<path d="' + area + '" fill="rgba(46,95,216,.10)"/>' +
        '<path d="' + dViews + '" fill="none" stroke="#2e5fd8" stroke-width="3" stroke-linejoin="round"/>' +
        '<path d="' + dVisit + '" fill="none" stroke="#e08a3c" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round"/>' +
        ticks + "</svg>";
    }

    function funnel(by) {
      by = by || {};
      var steps = [
        { k: "Visitors", v: +by.pageview || 0, c: "#2e5fd8" },
        { k: "Copied contract", v: +by.copy_contract || 0, c: "#e08a3c" },
        { k: "Buy clicks", v: +by.buy_click || 0, c: "#1aa06a" }
      ];
      var base = steps[0].v || 1;
      return steps.map(function (s) {
        var pct = Math.round(s.v / base * 100);
        return '<div class="funnel__step"><div class="funnel__top"><span>' + s.k + ' · ' + n(s.v) + '</span><span class="funnel__pct">' + pct + '%</span></div>' +
          '<div class="funnel__track"><div class="funnel__fill" style="width:' + Math.max(3, Math.min(100, pct)) + '%;background:' + s.c + '"></div></div></div>';
      }).join("");
    }

    var EVENTS = [
      { k: "meme_open", label: "Meme opens" }, { k: "pfp_download", label: "PFP saves" },
      { k: "poll_vote", label: "Poll votes" }, { k: "share_click", label: "Shares" },
      { k: "scores_tab", label: "Scores tabs" }, { k: "trade_click", label: "Trade clicks" }
    ];
    function eventsGrid(by) {
      by = by || {};
      return '<div class="events-grid">' + EVENTS.map(function (e) {
        return '<div class="ev"><div class="ev__k">' + esc(e.label) + '</div><div class="ev__v">' + n(by[e.k]) + "</div></div>";
      }).join("") + "</div>";
    }

    var TAGC = { pageview: "#9a8f80", buy_click: "#1aa06a", trade_click: "#1aa06a", copy_contract: "#2e5fd8", meme_open: "#e08a3c", banner_view: "#e08a3c", poll_vote: "#8e44ad", share_click: "#e84393", pfp_download: "#2e5fd8", pfp_nation: "#2e5fd8", scores_tab: "#9a8f80", sport_open: "#9a8f80", pageleave: "#cbbfae" };
    function feed(list) {
      list = (list || []).filter(function (e) { return e.type !== "pageleave"; });
      if (!list.length) return '<p class="muted">No recent activity.</p>';
      return '<ul class="feed">' + list.slice(0, 40).map(function (e) {
        var c = TAGC[e.type] || "#9a8f80";
        var meme = (e.type === "meme_open" && e.meta && e.meta.src) ? (" " + String(e.meta.src).split("/").pop()) : "";
        var where = esc((e.page || "") + meme);
        return '<li><span class="feed__t">' + ago(e.created_at) + '</span>' +
          '<span class="tag" style="background:' + c + '22;color:' + c + '">' + esc((e.type || "").replace(/_/g, " ")) + '</span>' +
          '<span class="feed__where">' + where + '</span>' +
          '<span>' + flag(e.country) + ' ' + (e.device === "mobile" ? "📱" : e.device === "tablet" ? "📲" : "💻") + '</span></li>';
      }).join("") + "</ul>";
    }

    function panel(cls, title, sub, body) {
      return '<div class="panel ' + cls + '"><div class="panel__h"><h2>' + esc(title) + "</h2>" + (sub ? "<small>" + esc(sub) + "</small>" : "") + '</div><div class="panel__b">' + body + "</div></div>";
    }

    function render(d) {
      ctrls.hidden = false;
      var o = d.overview || {}, by = o.by_type || {}, eng = d.engagement || {}, live = d.live || {};
      // live pill
      var on = +(live.online) || 0;
      liveN.textContent = on; livepill.classList.toggle("is-off", on === 0);

      view.innerHTML =
        '<div class="kpis">' +
          kpi("Pageviews", n(o.pageviews)) +
          kpi("Unique visitors", n(o.visitors)) +
          kpi("Live now", on, "kpi--live") +
          kpi("Avg time / page", dur(eng.avg_seconds)) +
          kpi("Avg scroll", (eng.avg_depth != null ? eng.avg_depth + "%" : "—")) +
          kpi("Bounce rate", (eng.bounce != null ? eng.bounce + "%" : "—")) +
        "</div>" +
        '<div class="dash">' +
          panel("p-chart", "Traffic over time", "● pageviews   ┄ visitors", chart(d.series)) +
          panel("p-funnel", "Conversion funnel", "of visitors", funnel(by)) +
          panel("p-events", "Attention events", "in range", eventsGrid(by)) +
          panel("p-sources", "Top sources", "referrer", bars(d.referrers, { none: "Direct / none" })) +
          panel("p-pages", "Top pages", "", bars(d.pages, { color: "#e08a3c" })) +
          panel("p-countries", "Countries", "", bars(d.countries, { map: function (l) { return l === "(none)" ? l : (flag(l) + " " + l); } })) +
          panel("p-devices", "Devices", "", bars(d.devices, { color: "#8e44ad" })) +
          panel("p-feed", "Live activity", "newest first", feed(d.recent)) +
          panel("p-memes", "Top memes", "opens", bars((d.memes || []).map(function (m) { return { label: String(m.label || "").split("/").pop(), count: m.count }; }), { color: "#e84393" })) +
          panel("p-campaigns", "Campaigns", "utm", bars(d.campaigns, { none: "untagged" })) +
        "</div>";
      lastAt = Date.now(); paintUpdated();
    }
    function kpi(k, v, cls) { return '<div class="kpi ' + (cls || "") + '"><div class="kpi__k">' + esc(k) + '</div><div class="kpi__v">' + v + "</div></div>"; }
    function paintUpdated() { if (lastAt) updated.textContent = "updated " + ago(lastAt) + " ago"; }

    function load() {
      if (!KEY) { askKey("This dashboard is private — enter your STATS_TOKEN."); return; }
      fetch("/api/stats?key=" + encodeURIComponent(KEY) + "&days=" + days, { cache: "no-store" })
        .then(function (r) { if (r.status === 401) throw "unauth"; return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d) { return; }
          if (d.configured === false) { setupHelp(); return; }
          render(d);
        })
        .catch(function (e) { if (e === "unauth") askKey("Wrong key — try again."); });
    }

    document.getElementById("ranges").addEventListener("click", function (e) {
      var b = e.target.closest(".rbtn"); if (!b) return;
      Array.prototype.forEach.call(this.children, function (x) { x.classList.remove("is-on"); });
      b.classList.add("is-on"); days = +b.dataset.d; load();
    });

    // auto-refresh every 20s + a "updated Xs ago" ticker
    load();
    timer = setInterval(load, 20000);
    tick = setInterval(paintUpdated, 5000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
  })();
  </script>
</body>
</html>
